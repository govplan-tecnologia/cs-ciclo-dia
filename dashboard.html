<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOVPLAN · CS · Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2F5E;--navy2:#243B73;--bg:#F7F8FA;--card:#fff;--line:#E4E7EC;--txt:#1F2937;--mut:#6B7280;
--ok:#15803D;--okbg:#DCFCE7;--bad:#B91C1C;--badbg:#FEE2E2;--warn:#B45309;--warnbg:#FEF3C7;--blue:#2563EB}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:inherit}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:700}
header h1 span{color:#4ADE80}
header .sp{flex:1}
header small{color:#A8C0F0}
.btn{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#ffffff18}
.btn:focus-visible,input:focus-visible{outline:2px solid #4ADE80;outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h2{font-size:15px;margin:32px 0 4px;font-weight:700}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpi span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:12px;color:var(--mut);font-weight:600;background:#F1F3F6}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.bar{height:8px;background:#EEF0F4;border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.row{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;padding:5px 0}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600}
.pill.r{background:var(--badbg);color:var(--bad)}.pill.g{background:var(--okbg);color:var(--ok)}.pill.y{background:var(--warnbg);color:var(--warn)}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tri .card b{font-size:20px;display:block}
.tri .card span{font-size:12px;color:var(--mut)}
.leg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.vazio{color:var(--mut);padding:8px 0}
/* login */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:340px}
#gate h1{margin:0 0 4px;font-size:18px;color:var(--navy)}
#gate h1 span{color:var(--ok)}
#gate p{margin:0 0 16px;color:var(--mut);font-size:13px}
#gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:10px}
#gate button{width:100%;padding:10px;border:0;border-radius:6px;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:wait}
#erro{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#app{display:none}
</style>
</head>
<body>

<section id="gate">
  <form id="f">
    <h1>GOV<span>PLAN</span> · CS</h1>
    <p>Área de gestão. Digite a senha para continuar.</p>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit" id="entrar">Entrar</button>
    <div id="erro" role="alert"></div>
    <p style="margin:14px 0 0"><a id="voltar1" href="cs_ciclo_dia.html">Voltar ao ciclo</a></p>
  </form>
</section>

<div id="app">
  <header>
    <h1>GOV<span>PLAN</span> · CS · Gestão</h1>
    <small id="atual"></small>
    <span class="sp"></span>
    <button class="btn" id="btnAtualizar">Atualizar</button>
    <a class="btn" id="voltar2" href="cs_ciclo_dia.html">Voltar ao ciclo</a>
    <button class="btn" id="btnSair">Sair</button>
  </header>
  <main id="conteudo"></main>
</div>

<script>
// ─── CONFIGURAÇÃO ────────────────────────────────────────────────────────────
const API_URL    = 'https://script.google.com/macros/s/AKfycbw6UaIQXS1Qqjv8Ge-MTMF52dVKkuE68B-T-3Aa0P2WdF0kho3xP5qQr295DwE94dPd/exec'; // a mesma URL /exec que o ciclo já usa
const VOLTAR_URL = 'cs_ciclo_dia.html';                       // página do ciclo

// ─── HELPERS ────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';
const num = v => v == null ? '—' : String(v).replace('.', ',');
const brl = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {maximumFractionDigits: 0});
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const dm  = d => d ? d.slice(8) + '/' + d.slice(5, 7) : '';
const ETAPAS = {1:'Boas-vindas',2:'Verificação de uso',3:'Acompanhamento CS',4:'Frequência de uso',5:'Nível de satisfação',6:'Início de renovação',7:'Acomp. de renovação',8:'Previsão de empenho',9:'Renovação'};
const corPct = v => v == null ? '#CBD5E1' : v <= 10 ? '#15803D' : v <= 30 ? '#B45309' : '#B91C1C';
const bar = (v, cor) => `<div class="bar"><i style="width:${Math.min(100, v || 0)}%;background:${cor || corPct(v)}"></i></div>`;
$('#voltar1').href = $('#voltar2').href = VOLTAR_URL;

// ─── LOGIN ──────────────────────────────────────────────────────────────────
async function buscar(senha) {
  const r = await fetch(`${API_URL}?tipo=dashboard&senha=${encodeURIComponent(senha)}`);
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro ao carregar');
  return j;
}
async function entrar(senha, auto) {
  const btn = $('#entrar'); btn.disabled = true; $('#erro').textContent = '';
  try {
    const d = await buscar(senha);
    sessionStorage.setItem('dash_senha', senha);
    $('#gate').style.display = 'none';
    $('#app').style.display = 'block';
    render(d);
  } catch (e) {
    sessionStorage.removeItem('dash_senha');
    $('#gate').style.display = 'flex'; $('#app').style.display = 'none';
    if (!auto) $('#erro').textContent = e.message;
  } finally { btn.disabled = false; }
}
$('#f').addEventListener('submit', e => { e.preventDefault(); entrar($('#senha').value, false); });
$('#btnSair').onclick = () => { sessionStorage.removeItem('dash_senha'); location.reload(); };
$('#btnAtualizar').onclick = () => entrar(sessionStorage.getItem('dash_senha') || '', true);
const salva = sessionStorage.getItem('dash_senha');
if (salva) entrar(salva, true);

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render(d) {
  $('#atual').textContent = `Dados de ${dm(d.periodo.inicio)} a ${dm(d.periodo.fim)} · atualizado ${d.geradoEm}`;
  const r = d.resumo;
  let h = '';

  h += `<div class="kpis">
    <div class="card kpi"><b>${r.total}</b><span>Ciclos no período</span></div>
    <div class="card kpi"><b style="color:var(--ok)">${pct(r.pctNoDia)}</b><span>Concluídos no mesmo dia</span></div>
    <div class="card kpi"><b style="color:${corPct(r.pctAtraso)}">${pct(r.pctAtraso)}</b><span>Em atraso (tardios + abertos)</span></div>
    <div class="card kpi"><b>${num(r.medianaDU)}</b><span>Mediana de dias úteis até concluir</span></div>
    <div class="card kpi"><b style="color:${r.pendentes ? 'var(--bad)' : 'var(--ok)'}">${r.pendentes}</b><span>Atrasos ainda abertos</span></div>
  </div>`;

  // Consultoras
  h += `<h2>Por consultora</h2><p class="sub">Percentual sobre os ciclos de cada uma, então quem tem mais clientes não sai prejudicada. "Ciclos/sem" é a carga média de ciclos por semana.</p>
  <div class="card wrap"><table><tr><th>Consultora</th><th class="n">Clientes vigentes</th><th class="n">Ciclos/sem</th><th class="n">Ciclos</th><th>No mesmo dia</th><th>Em atraso</th><th class="n">Abertos</th><th class="n">Mediana (dias úteis)</th></tr>
  ${d.consultoras.map(c => `<tr><td><b>${cap(c.nome)}</b></td><td class="n">${c.vigentes}</td><td class="n">${num(c.ciclosPorSemana)}</td><td class="n">${c.total}</td>
    <td>${pct(c.pctNoDia)}${bar(c.pctNoDia, '#15803D')}</td><td>${pct(c.pctAtraso)}${bar(c.pctAtraso)}</td>
    <td class="n">${c.pendentes}</td><td class="n">${num(c.medianaDU)}</td></tr>`).join('')}</table></div>`;

  // Tendência + faixas
  h += `<h2>Tendência semanal</h2><p class="sub">Semana em que o cliente entrou no ciclo. Linha vermelha em queda = a equipe está melhorando.</p>
  <div class="grid2"><div class="card">${tendencia(d.tendencia)}</div>
  <div class="card"><b>Quanto tempo levam para concluir</b>${faixas(d.faixas)}</div></div>`;

  // Etapas
  h += `<h2>Atraso por etapa</h2><p class="sub">Se uma etapa concentra atraso em todas as consultoras, o problema tende a ser o processo, não a pessoa.</p>
  <div class="card">${d.etapas.map(e => `<div class="row"><span>${e.etapa} · ${esc(e.nome)}</span>${bar(e.pctAtraso)}<span class="n" style="text-align:right">${pct(e.pctAtraso)}</span></div>`).join('')}
  <div class="leg"><span>Barra = % dos ciclos da etapa que não foram concluídos no mesmo dia</span></div></div>`;

  // Idade
  h += `<h2>Idade dos atrasos em aberto</h2><p class="sub">Separa quem atrasou ontem de quem está parado há semanas.</p>
  <div class="grid2"><div class="tri" style="grid-template-columns:1fr 1fr">${d.idade.buckets.map((b, i) => `<div class="card"><b style="color:${i > 1 && b.qtd ? 'var(--bad)' : 'inherit'}">${b.qtd}</b><span>${b.label}</span></div>`).join('')}</div>
  <div class="card wrap">${d.idade.lista.length ? `<table><tr><th>Cliente</th><th>Consultora</th><th>Etapa</th><th class="n">Dias úteis</th></tr>${d.idade.lista.map(x => `<tr><td>${esc(x.nome)}</td><td>${cap(x.cons)}</td><td>${x.etapa}</td><td class="n"><span class="pill ${x.idade > 5 ? 'r' : 'y'}">${x.idade}</span></td></tr>`).join('')}</table>` : '<div class="vazio">Nenhum atraso em aberto.</div>'}</div></div>`;

  // Recorrentes
  h += `<h2>Clientes recorrentemente atrasados</h2><p class="sub">Clientes com 2 ou mais ciclos atrasados. Podem precisar de uma abordagem diferente.</p>
  <div class="card wrap">${d.recorrentes.length ? `<table><tr><th>Cliente</th><th>Consultora</th><th>Etapas</th><th class="n">Ciclos atrasados</th><th class="n">Abertos</th></tr>${d.recorrentes.map(x => `<tr><td>${esc(x.nome)}</td><td>${cap(x.cons)}</td><td>${x.etapas.sort().join(', ')}</td><td class="n">${x.qtd}</td><td class="n">${x.pendentes}</td></tr>`).join('')}</table>` : '<div class="vazio">Nenhum cliente recorrente.</div>'}</div>`;

  // Risco
  const rk = d.risco;
  h += `<h2>Renovações em risco</h2><p class="sub">Contratos que vencem em até 120 dias com a etapa atrás do esperado (ou já vencidos e ainda vigentes). Total em risco: <b>${rk.totalRisco} cliente(s) · ${brl(rk.valorRisco)}</b>.</p>
  <div class="tri">${rk.buckets.map(b => `<div class="card"><b>${b.qtd}</b><span>${b.label} · ${brl(b.valor)}</span><div style="margin-top:6px">${b.emRisco ? `<span class="pill r">${b.emRisco} em risco · ${brl(b.valorRisco)}</span>` : '<span class="pill g">Tudo em dia</span>'}</div></div>`).join('')}</div>
  <div class="card wrap" style="margin-top:12px">${rk.lista.length ? `<table><tr><th>Cliente</th><th>Consultora</th><th>Vencimento</th><th>Etapa atual</th><th>Deveria estar</th><th class="n">Valor</th></tr>${rk.lista.map(x => `<tr><td>${esc(x.nome)}</td><td>${cap(x.cons)}</td><td>${dm(x.dataFim)} <span class="pill ${x.dias < 0 ? 'r' : x.dias <= 30 ? 'y' : 'g'}">${x.dias < 0 ? 'vencido' : x.dias + ' dias'}</span></td><td>${x.etapaAtual} · ${esc(ETAPAS[x.etapaAtual])}</td><td>${x.etapaEsperada} · ${esc(ETAPAS[x.etapaEsperada])}</td><td class="n">${brl(x.valor)}</td></tr>`).join('')}</table>` : '<div class="vazio">Nenhuma renovação em risco.</div>'}</div>`;

  // Renovação
  const rn = d.renovacao;
  h += `<h2>Taxa de renovação</h2><p class="sub">Clientes distintos com etapa 9 concluída contra clientes marcados como "não renova", desde o início do sistema.</p>
  <div class="tri"><div class="card"><b style="color:var(--ok)">${pct(rn.taxa)}</b><span>Taxa de renovação</span></div><div class="card"><b>${rn.renovados}</b><span>Renovaram</span></div><div class="card"><b style="color:${rn.naoRenovam ? 'var(--bad)' : 'inherit'}">${rn.naoRenovam}</b><span>Não renovam</span></div></div>
  ${rn.lista.length ? `<div class="card wrap" style="margin-top:12px"><table><tr><th>Cliente</th><th>Consultora</th><th>Data</th><th>Motivo registrado</th></tr>${rn.lista.map(x => `<tr><td>${esc(x.nome)}</td><td>${cap(x.cons)}</td><td>${dm(x.dia)}</td><td>${esc(x.det)}</td></tr>`).join('')}</table></div>` : ''}`;

  // Qualidade
  h += `<h2>Qualidade dos registros</h2><p class="sub">Informativo. "Repetidas" são conclusões clicadas mais de uma vez para o mesmo cliente e etapa no mesmo dia. "Em bloco" são etapas diferentes do mesmo cliente concluídas com menos de 10 minutos de intervalo.</p>
  <div class="card wrap"><table><tr><th>Consultora</th><th class="n">Conclusões</th><th class="n">Repetidas</th><th class="n">Em bloco</th></tr>${d.qualidade.map(q => `<tr><td><b>${cap(q.nome)}</b></td><td class="n">${q.conclusoes}</td><td class="n">${q.repetidas}</td><td class="n">${q.emBloco}</td></tr>`).join('')}</table></div>`;

  $('#conteudo').innerHTML = h;
}

function faixas(f) {
  const tot = f.noDia + f.d1_2 + f.d3_5 + f.d6mais + f.pendente || 1;
  const it = [['No mesmo dia', f.noDia, '#15803D'], ['1–2 dias úteis', f.d1_2, '#65A30D'], ['3–5 dias úteis', f.d3_5, '#B45309'], ['Mais de 5 dias úteis', f.d6mais, '#B91C1C'], ['Ainda não concluídos', f.pendente, '#7F1D1D']];
  return it.map(([l, v, c]) => `<div class="row"><span>${l}</span>${bar(100 * v / tot, c)}<span style="text-align:right">${v}</span></div>`).join('');
}

function tendencia(t) {
  if (t.length < 2) return '<div class="vazio">Dados insuficientes para a tendência.</div>';
  const W = 480, H = 200, p = {l: 34, r: 10, t: 10, b: 26};
  const x = i => p.l + i * (W - p.l - p.r) / (t.length - 1);
  const y = v => p.t + (100 - Math.min(100, v || 0)) * (H - p.t - p.b) / 100;
  const line = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${t.map((s, i) => x(i) + ',' + y(s[k])).join(' ')}"/>` +
    t.map((s, i) => `<circle cx="${x(i)}" cy="${y(s[k])}" r="3" fill="${c}"><title>${dm(s.semana)}: ${pct(s[k])} (${s.total} ciclos)</title></circle>`).join('');
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${p.l}" x2="${W - p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E4E7EC"/><text x="${p.l - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#6B7280">${v}%</text>`).join('');
  const lab = t.map((s, i) => `<text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#6B7280">${dm(s.semana)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tendência semanal">${grid}${lab}${line('pctNoDia', '#15803D')}${line('pctAtraso', '#B91C1C')}</svg>
  <div class="leg"><span><i style="background:#15803D"></i>No mesmo dia</span><span><i style="background:#B91C1C"></i>Em atraso</span></div>`;
}
</script>
</body>
</html>
